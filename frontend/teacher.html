<!DOCTYPE html>
<html>
<head>
  <title>Teacher Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <h1>Teacher Panel</h1>

  <h3>Register Student</h3>
  <input id="index" placeholder="Index Number">
  <input id="phone" placeholder="Parent Phone">
  <input id="fee" placeholder="Total Fee">
  <input id="grade" placeholder="Grade (10,11,12)">
  <button class="btn" onclick="register()">Register</button>

  <h3>Add Payment</h3>
  <input id="pIndex" placeholder="Index Number">
  <input id="amount" placeholder="Amount">
  <button class="btn" onclick="pay()">Add Payment</button>
</div>

<script>
async function register() {
  await fetch("https://school-system-7s0w.onrender.com/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      index: index.value,
      parentPhone: phone.value,
      totalFee: fee.value,
      grade: grade.value
    })
  });

  alert("Student registered");
}

async function pay() {
  await fetch("https://school-system-7s0w.onrender.com/pay", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      index: pIndex.value,
      amount: amount.value
    })
  });

  alert("Payment added");
}
</script>

</body>
</html>
