<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
  <h1>Student Login</h1>

  <form>
    <div class="input-box">
      <input type="text" placeholder="Index Number" required>
    </div>

    <div class="input-box">
      <input type="password" placeholder="Parent Phone" required>
    </div>

    <button class="btn">Login</button>
  </form>
</div>

<script>
document.querySelector("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const index = document.querySelector('input[placeholder="Index Number"]').value;
  const parentPhone = document.querySelector('input[placeholder="Parent Phone"]').value;

  const res = await fetch("https://school-system-7s0w.onrender.com/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ index, parentPhone })
  });

  const data = await res.json();

  if (data.success) {
    localStorage.setItem("index", index);
    window.location.href = "dashboard.html";
  } else {
    alert("Invalid login. Contact teacher.");
  }
});
</script>

</body>
</html>
