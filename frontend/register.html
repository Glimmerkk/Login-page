<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="wrapper">
  <h1>Register Student</h1>

  <form id="registerForm">

    <div class="input-box">
      <input type="text" id="index" placeholder="Index Number" required>
    </div>

    <div class="input-box">
      <input type="text" id="phone" placeholder="Parent Phone" required>
    </div>

    <div class="input-box">
      <input type="number" id="fee" placeholder="Total Fee" required>
    </div>

    <div class="input-box">
      <input type="text" id="grade" placeholder="Grade (10,11,12)" required>
    </div>

    <button class="btn">Register</button>

    <div class="register-link">
      <p>Already have an account? <a href="index.html">Login</a></p>
    </div>

  </form>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  await fetch("https://school-system-7s0w.onrender.com/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      index: index.value,
      parentPhone: phone.value,
      totalFee: fee.value,
      grade: grade.value
    })
  });

  alert("Student registered successfully");
});
</script>

</body>
</html>
