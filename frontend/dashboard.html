<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <span onclick="toggleMenu()">☰</span>
  Sugutek School
</div>

<div class="sidebar" id="sidebar">
  <p onclick="loadFees()">Fees</p>
  <p onclick="loadResults()">Results</p>
  <p onclick="loadCalendar()">Calendar</p>
</div>

<div id="content">
  <h2>Welcome Student</h2>
</div>

<script>
const index = localStorage.getItem("index");

function toggleMenu(){
  sidebar.classList.toggle("active");
}

async function loadFees(){
  const res = await fetch(`https://school-system-7s0w.onrender.com/student?index=${index}`);
  const d = await res.json();

  content.innerHTML = `
    <h2>Fees</h2>
    <p>Total: ${d.totalFee}</p>
    <p>Paid: ${d.paid}</p>
    <p>Balance: ${d.balance}</p>
  `;
}

async function loadResults(){
  const res = await fetch(`https://school-system-7s0w.onrender.com/student?index=${index}`);
  const d = await res.json();

  content.innerHTML = `<h2>${d.results}</h2>`;
}

async function loadCalendar(){
  const res = await fetch(`https://school-system-7s0w.onrender.com/student?index=${index}`);
  const d = await res.json();

  content.innerHTML = `<h2>${d.calendar}</h2>`;
}
</script>

</body>
</html>
